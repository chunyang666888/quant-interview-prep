[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-interview-prep"
version = "0.1.0"
description = "Solved quant & trading interview problems in Python: probability, brainteasers, coding-from-scratch."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["quant", "interview", "probability", "brainteaser", "trading"]

[tool.setuptools.packages.find]
include = ["qip*"]
